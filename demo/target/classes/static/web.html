
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Web Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: #f4f4f9;
        }

        .calc-box {
            width: 100%;
            max-width: 340px;
            padding: 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-top: 0;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            min-height: 24px;
            margin-block-start: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .hint {
            text-align: center;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="calc-box">
        <h2>Java Calculator</h2>
        <p class="hint">Calculate using Java and Spring Boot</p>

        <form id="calculatorForm">
            <input
                type="number"
                id="num1"
                step="any"
                placeholder="First number"
                aria-label="First number"
                required
            >

            <select id="operator" aria-label="Operation">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (*)</option>
                <option value="divide">Division (/)</option>
            </select>

            <input
                type="number"
                id="num2"
                step="any"
                placeholder="Second number"
                aria-label="Second number"
                required
            >

            <button id="calculateButton" type="submit">
                Calculate
            </button>
        </form>

        <div id="result" role="status" aria-live="polite"></div>
    </main>

    <script>
        const form = document.getElementById("calculatorForm");
        const resultDiv = document.getElementById("result");
        const button = document.getElementById("calculateButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const num1 = document.getElementById("num1").value;
            const num2 = document.getElementById("num2").value;
            const operator = document.getElementById("operator").value;

            resultDiv.style.color = "#333";
            resultDiv.textContent = "";

            if (num1.trim() === "" || num2.trim() === "") {
                resultDiv.style.color = "red";
                resultDiv.textContent = "Please enter both numbers.";
                return;
            }

            const params = new URLSearchParams({
                num1: num1,
                num2: num2,
                operator: operator
            });

            button.disabled = true;
            button.textContent = "Calculating...";

            try {
                const response = await fetch(
                    `/calculate?${params.toString()}`
                );

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(
                        data.error || "Calculation failed."
                    );
                }

                resultDiv.style.color = "#16803c";
                resultDiv.textContent = `Result: ${data.result}`;

            } catch (error) {
                resultDiv.style.color = "red";
                resultDiv.textContent =
                    error.message || "Error contacting server.";
            } finally {
                button.disabled = false;
                button.textContent = "Calculate";
            }
        });
    </script>
</body>
</html>
